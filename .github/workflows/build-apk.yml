name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Assets and Install Capacitor
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "mimi-pixel-pet", "version": "1.0.0", "private": true, "dependencies": {"@capacitor/android": "^6.0.0", "@capacitor/cli": "^6.0.0", "@capacitor/core": "^6.0.0"}}' > package.json
          fi
          npm install
          
          mkdir -p www
          cp -r index.html *.jpg www/ 2>/dev/null || true
          
          npx cap init "Mimi Pet" "com.mimi.pixelpet" --web-dir www || true
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mimi-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
