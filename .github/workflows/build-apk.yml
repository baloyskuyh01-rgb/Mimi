name: Build Mimi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web App
        run: |
          mkdir -p www
          cp index.html www/
          cp *.jpg www/ 2>/dev/null || true
          cp *.jpeg www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.webp www/ 2>/dev/null || true

      - name: Initialize Capacitor
        run: |
          npx cap init "Mimi Pixel Pet" "com.example.mimipixelpet" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mimi-Pixel-Pet-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
